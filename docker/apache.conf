# Développement uniquement : site Apache servi sur http://localhost:8080 (port 80 dans le conteneur).
# Mêmes réglages que le serveur de production (voir docs/hebergement.md), sans HTTPS.

# Lu par public/.htaccess : pas de redirection vers le HTTPS en développement
Define COMPTOIR_DEV

# Connexions gardées ouvertes entre deux interrogations des tablettes
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 15

# Compression des réponses de l'API et du manifeste, en plus des types déjà compressés
# par la configuration de mod_deflate (HTML, CSS, JavaScript)
AddOutputFilterByType DEFLATE application/json application/manifest+json image/svg+xml

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory /app/public>
        # public/.htaccess s'applique, comme en production
        AllowOverride All
        Require all granted
    </Directory>

    # Journal d'accès avec les octets reçus et envoyés, en-têtes compris (%I, %O)
    LogFormat "%h %t \"%r\" %>s %I %O %D" comptoir
    CustomLog /proc/self/fd/1 comptoir
    ErrorLog /proc/self/fd/2
</VirtualHost>
