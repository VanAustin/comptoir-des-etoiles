<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Apache ne transmet pas l'en-tête Authorization à PHP par défaut :
    # sans cette ligne, le jeton des tablettes (Authorization: Bearer) n'arrive jamais.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toute URL qui ne correspond pas à un fichier est confiée à Symfony
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
