# Propose chaque semaine des pull requests de mise à jour.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # On reste sur Symfony 7.4 LTS : pas de passage en 8.x proposé (décision à part, après la saison).
    # Les mises à jour mineures, les correctifs et les alertes de sécurité continuent d'arriver.
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
