framework:
    rate_limiter:
        # Échange d'un code d'appairage : 20 essais par 15 minutes et par IP.
        # Toutes les tablettes d'un même partage 4G partagent la même IP.
        pairing:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'

        # API des tablettes : 120 requêtes par minute et par tablette
        # (interrogation toutes les 2 à 3 secondes, avec de la marge).
        device_api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
