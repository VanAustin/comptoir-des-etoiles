# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Jetons CSRF liés à la session, sans JavaScript
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    # L'expiration après 2 heures d'inactivité est gérée par App\EventListener\SessionIdleListener.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        gc_maxlifetime: 7200

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
