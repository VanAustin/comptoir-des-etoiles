# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Jetons CSRF liés à la session, sans JavaScript
    csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    # L'expiration après 2 heures d'inactivité est gérée par App\EventListener\SessionIdleListener.
    session:
        # Sessions rangées dans le projet, pas dans le dossier partagé de l'hébergeur :
        # sur un mutualisé, celui-ci est vidé selon ses propres règles (souvent 24 min)
        # ou diffère d'un serveur à l'autre, et l'administrateur se retrouve déconnecté.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        gc_maxlifetime: 7200

    # Publication vers le hub Mercure : jamais plus de 2 secondes d'attente,
    # une commande ne doit pas rester bloquée par un hub injoignable
    http_client:
        default_options:
            timeout: 2
            max_duration: 2

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
