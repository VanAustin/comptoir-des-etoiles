security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # API des tablettes : sans session, jeton dans l'en-tête Authorization: Bearer
        api:
            pattern: ^/api/
            stateless: true
            custom_authenticators:
                - App\Security\DeviceTokenAuthenticator
            entry_point: App\Security\DeviceTokenAuthenticator
            access_denied_handler: App\Security\ApiAccessDeniedHandler
        main:
            lazy: true
            provider: admin_users

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_admin
                enable_csrf: true

            # « Rester connectée sur cet appareil » (case décochée par défaut) : cookie de 30 jours,
            # signé avec l'empreinte du mot de passe : app:admin:password déconnecte tous les appareils.
            # secure: auto, comme le cookie de session : sécurisé dès que le site est en HTTPS.
            remember_me:
                secret: '%kernel.secret%'
                name: REMEMBERME
                lifetime: 2592000
                signature_properties: ['password']
                secure: auto
                httponly: true
                samesite: lax

            # Déconnexion par formulaire POST avec jeton CSRF
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true

            # 5 tentatives par tranche de 15 minutes, par identifiant et par IP
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/pair$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_DEVICE }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
