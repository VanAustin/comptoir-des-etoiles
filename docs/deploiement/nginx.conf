# Exemple de configuration Nginx + PHP-FPM pour Le Comptoir des étoiles.
# À adapter : nom de domaine, chemins, version de PHP-FPM, certificat (Let's Encrypt, certbot).

server {
    listen 80;
    server_name comptoir.example.org;
    # HTTPS obligatoire : sans lui, pas de mode hors ligne sur les tablettes
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name comptoir.example.org;

    ssl_certificate     /etc/letsencrypt/live/comptoir.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comptoir.example.org/privkey.pem;

    # Seul le dossier public/ est servi : la base SQLite (var/) n'est jamais accessible
    root /var/www/comptoir-des-etoiles/public;

    # Corps des requêtes limité (l'application refuse au-delà de 64 Ko)
    client_max_body_size 1m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Nginx transmet l'en-tête Authorization (jeton des tablettes) sans réglage supplémentaire
        internal;
    }

    # Aucun autre fichier PHP n'est exécuté
    location ~ \.php$ {
        return 404;
    }
}
